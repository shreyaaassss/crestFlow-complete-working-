name: Deploy to AWS

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: "385467777110.dkr.ecr.ap-south-1.amazonaws.com"
  ECR_BACKEND: crestflow-backend
  ECR_FRONTEND: crestflow-frontend
  ECR_ORCHESTRATOR: crestflow-orchestrator
  ECS_CLUSTER: crestflow-cluster
  # ALB DNS names (stable - never change)
  BACKEND_URL: "http://crestflow-backend-alb-2020015408.ap-south-1.elb.amazonaws.com"
  FRONTEND_URL: "http://crestflow-frontend-alb-1530103458.ap-south-1.elb.amazonaws.com"
  # ECS networking
  SUBNETS: "subnet-02c88c5054720e50c,subnet-00a6046ba1f26bf42"
  TASK_SG: "sg-0fc0afe2820df1ad1"
  # Target groups
  BACKEND_TG: "arn:aws:elasticloadbalancing:ap-south-1:385467777110:targetgroup/crestflow-backend-tg/16c63b84a602f271"
  FRONTEND_TG: "arn:aws:elasticloadbalancing:ap-south-1:385467777110:targetgroup/crestflow-frontend-tg/3cbe3d6515832be3"
  # IAM
  ECS_EXEC_ROLE: "arn:aws:iam::385467777110:role/crestflow-ecs-execution-role"

jobs:
  # ─── Build & Push Docker images ─────────────────────────────────────────────
  build:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Build & push backend
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_BACKEND:$TAG -t $ECR_REGISTRY/$ECR_BACKEND:latest ./backend
          docker push $ECR_REGISTRY/$ECR_BACKEND:$TAG
          docker push $ECR_REGISTRY/$ECR_BACKEND:latest
          echo "✓ Backend: $ECR_REGISTRY/$ECR_BACKEND:$TAG"

      - name: Build & push frontend
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker build \
            --build-arg VITE_API_URL="${{ secrets.VITE_API_URL }}" \
            --build-arg VITE_SUPABASE_URL="${{ secrets.VITE_SUPABASE_URL }}" \
            --build-arg VITE_SUPABASE_ANON_KEY="${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            --build-arg VITE_ADMIN_EMAIL="${{ secrets.VITE_ADMIN_EMAIL }}" \
            -t $ECR_REGISTRY/$ECR_FRONTEND:$TAG \
            -t $ECR_REGISTRY/$ECR_FRONTEND:latest \
            ./crest-flow-ui-main
          docker push $ECR_REGISTRY/$ECR_FRONTEND:$TAG
          docker push $ECR_REGISTRY/$ECR_FRONTEND:latest
          echo "✓ Frontend: $ECR_REGISTRY/$ECR_FRONTEND:$TAG"

      - name: Build & push orchestrator
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_ORCHESTRATOR:$TAG -t $ECR_REGISTRY/$ECR_ORCHESTRATOR:latest ./orchestrator
          docker push $ECR_REGISTRY/$ECR_ORCHESTRATOR:$TAG
          docker push $ECR_REGISTRY/$ECR_ORCHESTRATOR:latest
          echo "✓ Orchestrator: $ECR_REGISTRY/$ECR_ORCHESTRATOR:$TAG"

  # ─── Deploy Backend (ECS Fargate + ALB) ─────────────────────────────────────
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update backend ECS task definition & service
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          NEW_IMAGE="$ECR_REGISTRY/$ECR_BACKEND:$TAG"
          echo "Deploying: $NEW_IMAGE"

          CURRENT=$(aws ecs describe-task-definition \
            --task-definition crestflow-backend \
            --query taskDefinition 2>/dev/null)

          NEW_TASK=$(echo "$CURRENT" | jq \
            --arg IMAGE "$NEW_IMAGE" \
            --arg JWT "${{ secrets.JWT_SECRET }}" \
            --arg SUPABASE_KEY "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            --arg DEPLOYER "${{ secrets.DEPLOYER_MNEMONIC }}" \
            --arg ADMIN_KEY "${{ secrets.ADMIN_API_KEY }}" \
            --arg FRONTEND "$FRONTEND_URL" \
            'del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)
            | .containerDefinitions[0].image = $IMAGE
            | (.containerDefinitions[0].environment[] | select(.name=="JWT_SECRET")).value = $JWT
            | (.containerDefinitions[0].environment[] | select(.name=="SUPABASE_SERVICE_ROLE_KEY")).value = $SUPABASE_KEY
            | (.containerDefinitions[0].environment[] | select(.name=="DEPLOYER_MNEMONIC")).value = $DEPLOYER
            | (.containerDefinitions[0].environment[] | select(.name=="ADMIN_API_KEY")).value = $ADMIN_KEY
            | (.containerDefinitions[0].environment[] | select(.name=="FRONTEND_URL")).value = $FRONTEND')

          NEW_ARN=$(aws ecs register-task-definition \
            --cli-input-json "$NEW_TASK" \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "New task def: $NEW_ARN"

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service crestflow-backend \
            --task-definition "$NEW_ARN" \
            --force-new-deployment \
            --output json > /dev/null
          echo "✓ Backend deployment initiated"
          echo "Backend URL: $BACKEND_URL"

  # ─── Deploy Frontend (ECS Fargate + ALB) ────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update frontend ECS task definition & service
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          NEW_IMAGE="$ECR_REGISTRY/$ECR_FRONTEND:$TAG"
          echo "Deploying: $NEW_IMAGE"

          CURRENT=$(aws ecs describe-task-definition \
            --task-definition crestflow-frontend \
            --query taskDefinition 2>/dev/null)

          NEW_TASK=$(echo "$CURRENT" | jq \
            --arg IMAGE "$NEW_IMAGE" \
            'del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)
            | .containerDefinitions[0].image = $IMAGE')

          NEW_ARN=$(aws ecs register-task-definition \
            --cli-input-json "$NEW_TASK" \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "New task def: $NEW_ARN"

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service crestflow-frontend \
            --task-definition "$NEW_ARN" \
            --force-new-deployment \
            --output json > /dev/null
          echo "✓ Frontend deployment initiated"
          echo "Frontend URL: $FRONTEND_URL"

  # ─── Deploy Orchestrator (ECS Fargate, background) ──────────────────────────
  deploy-orchestrator:
    name: Deploy Orchestrator
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update orchestrator ECS task definition & service
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          NEW_IMAGE="$ECR_REGISTRY/$ECR_ORCHESTRATOR:$TAG"
          echo "Deploying: $NEW_IMAGE"

          CURRENT=$(aws ecs describe-task-definition \
            --task-definition crestflow-orchestrator \
            --query taskDefinition 2>/dev/null)

          NEW_TASK=$(echo "$CURRENT" | jq \
            --arg IMAGE "$NEW_IMAGE" \
            --arg SUPABASE_KEY "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            --arg ORCH "${{ secrets.ORCHESTRATOR_MNEMONIC }}" \
            'del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)
            | .containerDefinitions[0].image = $IMAGE
            | .containerDefinitions[0].command = []
            | .containerDefinitions[0].environment = [
                {"name":"NETWORK","value":"testnet"},
                {"name":"ALGOD_SERVER","value":"https://testnet-api.algonode.cloud"},
                {"name":"ALGOD_PORT","value":"443"},
                {"name":"ALGOD_TOKEN","value":""},
                {"name":"ESCROW_APP_ID","value":"762218790"},
                {"name":"TBILL_APP_ID","value":"762214340"},
                {"name":"TBILL_1D_ASA","value":"762214378"},
                {"name":"TBILL_3D_ASA","value":"762214379"},
                {"name":"TBILL_7D_ASA","value":"762214380"},
                {"name":"TBILL_14D_ASA","value":"762214381"},
                {"name":"TBILL_30D_ASA","value":"762214389"},
                {"name":"TBILL_60D_ASA","value":"762214390"},
                {"name":"TBILL_90D_ASA","value":"762214391"},
                {"name":"PLATFORM_WALLET_ADDRESS","value":"A2EGSHGIZMU7X6YRSLSC7GVDTXE6MAQCZODAWHWOVHLW6HCLOBJSTWLOFY"},
                {"name":"SUPABASE_URL","value":"https://yetssyjyhmujmxefwxvh.supabase.co"},
                {"name":"SUPABASE_ANON_KEY","value":"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlldHNzeWp5aG11am14ZWZ3eHZoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3MjUwODQsImV4cCI6MjA5NDMwMTA4NH0.FFTnyf3l1hWq_SzK_-G5cNwQoofXPbhvzJb7KX6Xfyk"},
                {"name":"SUPABASE_SERVICE_ROLE_KEY","value":$SUPABASE_KEY},
                {"name":"ORCHESTRATOR_MNEMONIC","value":$ORCH},
                {"name":"POLL_INTERVAL_MS","value":"30000"},
                {"name":"MIN_ORDER_AMOUNT_MICROALGO","value":"5000000"},
                {"name":"YIELD_BACKEND","value":"reserve"}
              ]')

          NEW_ARN=$(aws ecs register-task-definition \
            --cli-input-json "$NEW_TASK" \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "New task def: $NEW_ARN"

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service crestflow-orchestrator \
            --task-definition "$NEW_ARN" \
            --force-new-deployment \
            --output json > /dev/null
          echo "✓ Orchestrator deployment initiated"

  # ─── Summary ────────────────────────────────────────────────────────────────
  summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend, deploy-orchestrator]
    if: always()

    steps:
      - name: Print deployment URLs
        run: |
          echo "════════════════════════════════════════════════════"
          echo "  CrestFlow Deployment Summary"
          echo "════════════════════════════════════════════════════"
          echo "  Backend  : $BACKEND_URL/health"
          echo "  Frontend : $FRONTEND_URL"
          echo "  Orchestrator: ECS crestflow-cluster/crestflow-orchestrator"
          echo ""
          echo "  ECS tasks take ~2-3 minutes to start."
          echo "  Watch: https://ap-south-1.console.aws.amazon.com/ecs"
          echo "════════════════════════════════════════════════════"
